app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: ${BACKSTAGE_BASE_URL}

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: ${BACKSTAGE_BASE_URL}
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'
  cors:
    origin: ${BACKSTAGE_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  auth:
    externalAccess:
      - type: legacy
        options:
          secret: ${BACKEND_SECRET}
          subject: backstage-server

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    # Keep one database and isolate plugins with PostgreSQL schemas. This avoids
    # granting the application role cluster-wide CREATEDB privileges.
    pluginDivisionMode: schema
    schemaPrefix: backstage_
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DATABASE}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  environment: production
  providers:
    oidc:
      production:
        metadataUrl: ${AUTH_OIDC_METADATA_URL}
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto

# Repositories are discovered by packages/backend/src/modules/giteaUserDiscovery.ts;
# the upstream Gitea provider only enumerates organizations.

# Each repository publishes its own docs from CI via
# panxiao81/ci-actions/publish-techdocs; Backstage only reads the bucket.
techdocs:
  builder: external
  publisher:
    type: awsS3
    awsS3:
      bucketName: techdocs
      region: us-east-1
      endpoint: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${TECHDOCS_S3_ACCESS_KEY_ID}
        secretAccessKey: ${TECHDOCS_S3_SECRET_ACCESS_KEY}

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  # Flux objects shown on the entity Kubernetes tab, matched by the
  # backstage.io/kubernetes-id label. Only served versions are listed: a missing
  # apiVersion returns NOT_FOUND and surfaces as an error on the tab. Every kind
  # here needs get/list in homelab-infra's backstage-read-only ClusterRole;
  # HelmReleases are deliberately not readable.
  customResources:
    - group: kustomize.toolkit.fluxcd.io
      apiVersion: v1
      plural: kustomizations
    - group: source.toolkit.fluxcd.io
      apiVersion: v1
      plural: gitrepositories
    - group: source.toolkit.fluxcd.io
      apiVersion: v1
      plural: helmrepositories
    - group: source.toolkit.fluxcd.io
      apiVersion: v1
      plural: ocirepositories
    - group: image.toolkit.fluxcd.io
      apiVersion: v1
      plural: imagerepositories
    - group: image.toolkit.fluxcd.io
      apiVersion: v1
      plural: imagepolicies
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: homelab
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
