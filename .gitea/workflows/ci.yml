name: CI and image

on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE: zot-push.ad.ddupan.top/panxiao81/backstage

jobs:
  verify:
    runs-on: [self-hosted, pod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn ci
      - run: yarn build:backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-bundle
          path: packages/backend/dist/*.tar.gz
          if-no-files-found: error

  image:
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, pod]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-bundle
          path: packages/backend/dist
      - name: Log in to Zot with a short-lived JWT-SVID
        shell: bash
        run: |
          set -euo pipefail
          jwt_response="$(docker run --rm \
            --volume /run/spire/agent-sockets:/run/spire/agent-sockets \
            ghcr.io/spiffe/spire-agent:1.15.3 \
            api fetch jwt \
            -audience zot \
            -socketPath /run/spire/agent-sockets/spire-agent.sock \
            -output json)"
          jwt_svid="$(printf '%s' "$jwt_response" | node -e \
            "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d)[0].svids[0].svid))")"
          printf '%s' "$jwt_svid" | docker login zot-push.ad.ddupan.top \
            --username zot --password-stdin
          unset jwt_svid jwt_response
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ gitea.sha }}
            ${{ env.IMAGE }}:latest
      - name: Record immutable image reference
        run: printf '%s@%s\n' "$IMAGE" "${{ steps.build.outputs.digest }}" | tee image-ref.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image-ref.txt
          if-no-files-found: error
