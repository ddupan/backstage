name: TechDocs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - catalog-info.yaml
      - .gitea/workflows/techdocs.yml

jobs:
  # The job id is part of this job's SPIFFE ID; OpenBao only lets jobs named
  # `techdocs` read the TechDocs publisher credentials.
  techdocs:
    runs-on: [self-hosted, pod]
    steps:
      - uses: actions/checkout@v4
      # Full URL: Gitea resolves short `uses:` names against github.com.
      - uses: https://git.ddupan.top/panxiao81/ci-actions/publish-techdocs@v1
